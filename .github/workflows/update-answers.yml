name: 質問箱の回答を取り込む

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 朝6時（日本時間）
  workflow_dispatch:        # Actions画面の「Run workflow」で手動実行もできる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-querie.mjs
      - name: 変更があればコミット
        run: |
          if git diff --quiet; then
            echo "新しい回答はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/querie.json
          git commit -m "質問箱の新しい回答を取り込み"
          git push
